<div class="auth-selection-container">
  <div class="auth-selection-card">
    <h1 class="auth-title">Welcome to WoodMart</h1>
    <p class="auth-subtitle">Please choose an option to continue</p>

    <div class="button-group">
      <button class="auth-btn login-btn" (click)="navigateToLogin()">
        <span class="btn-text">Login</span>
        <span class="btn-description">Already have an account?</span>
      </button>

      <button class="auth-btn register-btn" (click)="navigateToRegister()">
        <span class="btn-text">Register</span>
        <span class="btn-description">Create a new account</span>
      </button>
    </div>
  </div>
</div>
