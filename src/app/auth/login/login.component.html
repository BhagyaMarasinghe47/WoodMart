<div class="login-container">
  <!-- Blurred background layer -->
  <div class="blur-background"></div>
  
  <!-- Image box on the left -->
  <div class="image-box">
    <div class="image-content">
      <h1 class="brand-title">WoodMart</h1>
      <h2 class="main-heading">EXPLORE<br>HORIZONS</h2>
      <p class="tagline">Where Your Dream Destinations<br>Become Reality.</p>
      <p class="description">Embark on a journey where every corner<br>of the world is within your reach.</p>
    </div>
  </div>
  
  <!-- Login form card on the right -->
  <div class="login-card">
    <div class="login-header">
      <h1>Welcome to WoodMart</h1>
      <p>Sign in to continue</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <!-- Role Selector -->
      <div class="form-group">
        <label for="role">Select Role</label>
        <select 
          id="role" 
          [(ngModel)]="selectedRole" 
          name="role"
          class="role-select">
          <option value="CUSTOMER">User</option>
          <option value="VENDOR">Vendor</option>
          <option value="CRAFTSMAN">Craftsman</option>
        </select>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="email" 
          name="email"
          placeholder="Enter your email"
          required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="password" 
          name="password"
          placeholder="Enter your password"
          required>
      </div>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <button 
        type="submit" 
        class="btn-login" 
        [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="register-link">
      Don't have an account? 
      <a (click)="navigateToRegister()">Register here</a>
    </div>
  </div>
</div>
