<div class="login-container">
  <!-- Blurred background layer -->
  <div class="blur-background"></div>
  
  <!-- Image box on the left -->
  <div class="image-box">
    <div class="image-content">
      <h1 class="brand-title">WoodMart</h1>
      <h2 class="main-heading">EXPLORE<br>HORIZONS</h2>
      <p class="tagline">Where Your Dream Destinations<br>Become Reality.</p>
      <p class="description">Embark on a journey where every corner<br>of the world is within your reach.</p>
    </div>
  </div>
  
  <!-- Login form card on the right -->
  <div class="login-card">
    <div class="login-header">
      <h1>Welcome to WoodMart</h1>
      <p>Sign in to continue</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="email" 
          name="email"
          placeholder="Enter your email"
          required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            required>
          <button type="button" class="toggle-password" (click)="showPassword = !showPassword" tabindex="-1">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <button 
        type="submit" 
        class="btn-login" 
        [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="register-link">
      Don't have an account? 
      <a (click)="navigateToRegister()">Register here</a>
    </div>
  </div>
</div>
