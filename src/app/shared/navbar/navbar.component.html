<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand" routerLink="/">
      <img src="assets/images/logo.png" alt="WoodMart Logo" class="logo-img">
      <span class="logo">WoodMart</span>
    </div>

    <div class="navbar-menu">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/products" routerLinkActive="active">Products</a>
      <a routerLink="/shops" routerLinkActive="active">Shops</a>
      <a routerLink="/cart" routerLinkActive="active" class="cart-link">
        Cart
        <span *ngIf="cartItemCount > 0" class="cart-badge">{{ cartItemCount }}</span>
      </a>
      
      <div *ngIf="currentUser; else loginLink" class="user-menu">
        <button class="user-button" (click)="navigateToDashboard()">
          {{ currentUser.firstName }} ({{ currentUser.role }})
        </button>
        <button class="btn-logout" (click)="logout()">Logout</button>
      </div>
      
      <ng-template #loginLink>
        <div class="auth-buttons">
          <button *ngIf="!showAuthOptions" (click)="toggleAuthOptions()" class="btn-login">
            Login
          </button>
          <div *ngIf="showAuthOptions" class="auth-options">
            <button (click)="navigateToLogin()" class="btn-login">Login</button>
            <button (click)="navigateToRegister()" class="btn-register">Register</button>
          </div>
        </div>
      </ng-template>
    </div>
  </div>
</nav>
