<div class="toast-container">
  <div
    *ngFor="let toast of toasts$ | async; trackBy: trackById"
    class="toast"
    [class]="'toast toast-' + toast.type">

    <!-- Icon -->
    <div class="toast-icon-wrap">
      <!-- Success checkmark -->
      <svg *ngIf="toast.type === 'success'" xmlns="http://www.w3.org/2000/svg"
           width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <!-- Error X -->
      <svg *ngIf="toast.type === 'error'" xmlns="http://www.w3.org/2000/svg"
           width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
      <!-- Warning ! -->
      <svg *ngIf="toast.type === 'warning'" xmlns="http://www.w3.org/2000/svg"
           width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </div>

    <span class="toast-message">{{ toast.message }}</span>

    <button class="toast-close" (click)="dismiss(toast.id)" aria-label="Close">✕</button>
  </div>
</div>
